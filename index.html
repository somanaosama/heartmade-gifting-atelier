<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>HeartMade Gifting Atelier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
/* VOICE: Patchi boutique counter — calm, assured, generous with space; quiet luxury, never loud.
   IDEA: the tablet behaves like patchi.com set on a counter: ivory page, slim header with text navigation, square product tiles.
   PICTURE: each screen's working surface (cards, tray, gift preview) fills the content band under the header.
   COLOUR and TYPE: ivory #f5f0e9 ground, forest #1e3b2c ink, sage #6e8b6f hero panels, mint tint for selection, a touch of orange only for warnings; Jost light headings + Jost text.
   LAYOUT: header 72px · left-aligned title · content band · hairline footer with Back left, primary action right. */
:root{--ivory:#f5f0e9;--paper:#fbf9f5;--forest:#1e3b2c;--ink:#1e3b2c;--body:#4b5a4f;--muted:#7f877f;--sage:#6e8b6f;--sage2:#97b994;--mint:#e5ede1;--tile:#ede6db;--line:rgba(30,59,44,.15);--line2:rgba(30,59,44,.28);--warn:#c8652e;--gold:#b8934a;--goldl:#d9bd7c;color-scheme:light}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#d9d3c9}
body{font:16px/1.5 Jost,'Helvetica Neue',Arial,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased}
img{-webkit-user-drag:none;user-drag:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0}
input,textarea{-webkit-user-select:text;user-select:text;font-family:Jost,sans-serif}
#app{position:fixed;inset:0;display:flex}
.pane{position:relative;flex:1;overflow:hidden;display:none}
.m-customer #paneC,.m-host #paneE,.m-split .pane{display:block}
.m-split .pane+.pane{border-left:1px solid #b9b2a6}
.stage{position:absolute;left:0;top:0;width:1180px;height:820px;transform-origin:0 0;overflow:hidden;background:var(--ivory)}
.scr{position:absolute;inset:0;overflow:hidden;background:var(--ivory)}
.page::after{content:"";position:absolute;left:48px;right:48px;top:728px;height:1px;background:var(--line)}
svg{display:block}

/* header — like patchi.com's top bar */
.hdr{position:absolute;left:0;right:0;top:0;height:72px;display:flex;align-items:center;padding:0 24px 0 48px;border-bottom:1px solid var(--forest);background:var(--ivory);z-index:4}
.brand{display:flex;align-items:center;gap:12px;white-space:nowrap}
.brand img{width:30px;height:30px}
.brand b{font-weight:500;font-size:20px;letter-spacing:.01em}
.brand span{font-weight:300;font-size:17px;color:var(--body)}
.nav{margin-left:auto;display:flex;align-items:stretch;height:72px;gap:26px;margin-right:22px}
.nv{display:flex;align-items:center;font-size:14.5px;font-weight:400;color:var(--ink);opacity:.38;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.nv.done{opacity:.85}.nv.cl{cursor:pointer}
.nv.cur{opacity:1;font-weight:500;border-bottom-color:var(--forest)}
.staff{display:flex;gap:4px;margin-left:auto}
.nav+.staff{margin-left:0}
.staff button{width:42px;height:42px;display:grid;place-items:center;color:var(--ink);opacity:.6}
.staff svg{width:20px;height:20px}

/* titles */
.ttl{position:absolute;left:48px;top:100px;margin:0;font-weight:300;font-size:38px;line-height:1.12;letter-spacing:-.005em;color:var(--forest)}
.sub{position:absolute;left:48px;top:150px;margin:0;font-size:16.5px;color:var(--body)}
.note{position:absolute;left:48px;top:176px;margin:0;font-size:13.5px;color:var(--muted)}
.ttl+.sub+.note{top:174px}

/* footer actions */
.btn{position:absolute;right:48px;bottom:20px;height:54px;padding:0 30px;background:var(--forest);color:var(--ivory);font-weight:500;font-size:16px;letter-spacing:.01em;display:flex;align-items:center;gap:14px;border-radius:1px;transition:opacity .2s,background .2s}
.btn:active{background:#2c5040}
.btn.dis{opacity:.3}
.btn svg{width:22px}
.back{position:absolute;left:36px;bottom:22px;height:50px;padding:0 12px;display:flex;align-items:center;gap:10px;font-size:15.5px;color:var(--ink)}
.back svg{width:18px}
.fnote{position:absolute;left:0;right:0;bottom:38px;text-align:center;font-size:12.5px;color:var(--muted);pointer-events:none}

/* cards — flat, hairline, square */
.card{background:var(--paper);border:1px solid var(--line);border-radius:2px;position:relative;transition:border-color .2s,background .2s}
.card.on{border-color:var(--forest);box-shadow:inset 0 0 0 1px var(--forest);background:#fff}
button.card:active{background:#f3efe7}
.tile{background:var(--tile);display:grid;place-items:center;flex:none}
.tile img{object-fit:contain;filter:drop-shadow(0 6px 6px rgba(60,40,20,.16))}
.chk,.ringon,.ring{position:absolute;right:12px;top:12px;width:24px;height:24px;display:grid;place-items:center}
.chk,.ringon{background:var(--forest);animation:pop .25s}
.chk svg,.ringon svg{width:15px;height:15px}
.ring{border:1px solid var(--line2);background:var(--paper)}
@keyframes pop{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes breathe{50%{opacity:.4}}

/* welcome hero — split like the patchi.com banner */
.hero{position:absolute;left:0;right:0;top:72px;bottom:0;display:flex}
.hero-t{width:600px;background:var(--sage);color:#f7f3ec;padding:92px 64px 0 56px;position:relative}
.hero-i{flex:1;overflow:hidden;background:#2c3320}
.hero-i img{width:100%;height:100%;object-fit:cover;object-position:50% 72%;display:block}
.hero-k{font-size:14px;letter-spacing:.02em;color:rgba(247,243,236,.78)}
.hero-h{margin:18px 0 0;font-weight:300;font-size:60px;line-height:1.04;letter-spacing:-.01em;text-wrap:balance}
.hero-p{margin:24px 0 0;max-width:440px;font-size:17.5px;line-height:1.6;color:rgba(247,243,236,.86)}
.hero-b{margin-top:42px;display:inline-flex;align-items:center;gap:16px;height:58px;padding:0 32px;background:#fbf9f5;color:var(--forest);font-weight:500;font-size:16.5px;border-radius:1px}
.hero-b svg{width:22px}
.hero-b:active{background:#ece6db}
.hero-f{position:absolute;left:56px;right:64px;bottom:34px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid rgba(247,243,236,.3);padding-top:16px;font-size:14px;color:rgba(247,243,236,.8)}
.hero-f button{display:flex;align-items:center;gap:8px;color:#f7f3ec;font-size:14.5px;padding:6px 0 6px 10px}
.hero-f svg{width:16px}
.tapl{animation:breathe 2.8s ease-in-out infinite}
.steps{margin-top:30px;display:flex;flex-direction:column;gap:12px}
.sp{display:flex;align-items:center;gap:14px;font-size:16px;color:rgba(247,243,236,.6)}
.sp i{width:24px;height:24px;border:1px solid rgba(247,243,236,.6);display:grid;place-items:center}
.sp i svg{width:14px}
.sp.ok{color:#f7f3ec}.sp.ok i{background:#f7f3ec;border-color:#f7f3ec}
.sp.ok i svg path{stroke:var(--forest)}
.sp.now i{animation:breathe 1.6s infinite;border-color:#f7f3ec}
.ono{margin-top:22px;font-size:15px;color:rgba(247,243,236,.85)}
.ono b{font-weight:500;font-size:22px;letter-spacing:.04em;color:#fff;margin-left:6px}

/* flavor */
.fgrid{position:absolute;left:48px;top:206px;width:1084px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.fcard{height:128px;display:flex;align-items:center;gap:20px;padding:9px;text-align:left}
.fcard .tile{width:108px;height:108px}
.fcard .tile img{width:84px;height:70px}
.fcard span{font-size:19px;font-weight:400;line-height:1.2}
.avoid{position:absolute;left:48px;top:498px}
.avoid h3{margin:0 0 4px;font-weight:400;font-size:19px}
.avoid p{margin:0 0 14px;font-size:14px;color:var(--muted)}
.chips{display:flex;gap:12px}
.chip{height:48px;padding:0 26px;border:1px solid var(--line2);background:var(--paper);font-size:15.5px;border-radius:1px;transition:all .2s}
.chip.on{background:var(--forest);border-color:var(--forest);color:var(--ivory)}

/* pick */
.pgrid{position:absolute;left:48px;top:212px;width:1084px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.pcard{height:150px;display:flex;align-items:center;gap:18px;padding:9px;text-align:left}
.pcard .tile{width:130px;height:130px}
.pcard .tile img{width:104px}
.pcard .pt{display:flex;flex-direction:column;gap:6px;padding-right:30px}
.pcard em{font-style:normal;font-size:12.5px;font-weight:500;color:var(--sage)}
.pcard b{font-weight:400;font-size:19px;line-height:1.2}
.empty{position:absolute;left:48px;top:212px;font-size:18px;color:var(--body);max-width:620px}

/* tasting */
.tast{position:absolute;left:48px;top:200px;width:480px;height:510px}
.tast .tile{width:100%;height:100%}
.heroc{width:300px;animation:rise .45s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.tinfo{position:absolute;left:560px;top:204px;width:572px}
.tinfo .cnt{font-size:13.5px;color:var(--muted)}
.tinfo h3{margin:6px 0 12px;font-weight:300;font-size:40px;line-height:1.1}
.tinfo p{margin:0;font-size:17.5px;line-height:1.55;color:var(--body);max-width:520px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.tag{font-size:13px;padding:4px 10px;border:1px solid var(--line2);color:var(--body)}
.tag.al{border-color:rgba(200,101,46,.45);color:#9c4b1f}
.react{position:absolute;left:560px;top:528px;width:572px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.rcard{height:132px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-size:16px;line-height:1.25;text-align:center}
.rcard svg{width:30px;height:30px}
.rcard.on{background:var(--forest);color:var(--ivory);border-color:var(--forest);box-shadow:none}
.rlbl{position:absolute;left:560px;top:500px;font-size:13.5px;color:var(--muted)}
.tstrip{position:absolute;left:168px;bottom:18px;display:flex;gap:8px;align-items:center}
.tth{width:58px;height:58px;background:var(--tile);position:relative;display:grid;place-items:center;border:1px solid transparent}
.tth img{width:44px}
.tth.cur{border-color:var(--forest);box-shadow:inset 0 0 0 1px var(--forest)}
.tth i{position:absolute;right:-5px;top:-5px;width:20px;height:20px;display:grid;place-items:center;background:var(--paper);border:1px solid var(--line)}
.tth i svg{width:12px;height:12px}

/* favorites */
.fvrow{position:absolute;left:48px;top:206px;display:flex;gap:14px}
.fv{width:208px;height:252px;display:flex;flex-direction:column;padding:8px;text-align:left}
.fv .tile{width:100%;height:182px}
.fv .tile img{width:132px}
.fv b{font-weight:400;font-size:17px;line-height:1.2;padding:10px 4px 0}
.fv:not(.on){opacity:.6}
.fvrow.many .fv{width:170px;height:226px}.fvrow.many .fv .tile{height:156px}.fvrow.many .fv .tile img{width:104px}
.mayb{position:absolute;left:48px;top:484px;display:flex;align-items:center;gap:10px;font-size:15px;color:var(--body)}
.mb{display:flex;align-items:center;gap:10px;height:50px;padding:0 16px 0 6px;border:1px solid var(--line2);background:var(--paper);font-size:15px}
.mb img{width:38px;height:38px;object-fit:contain;background:var(--tile)}
.mb.on{border-color:var(--forest);box-shadow:inset 0 0 0 1px var(--forest)}
.addmore{position:absolute;left:48px;top:560px;height:50px;padding:0 24px;border:1px solid var(--forest);font-size:15.5px;display:flex;align-items:center;gap:10px}

/* box */
.bgrid{position:absolute;left:48px;top:206px;width:1084px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.bcard{height:330px;display:flex;flex-direction:column;padding:8px;text-align:left}
.bcard .tile{height:246px;width:100%;background:#f1e9dc}
.bcard .tile img{width:250px;height:200px;filter:none}
.bcard .bt{display:flex;justify-content:space-between;align-items:baseline;padding:14px 8px 0}
.bcard b{font-weight:400;font-size:20px}
.bcard small{font-size:14px;color:var(--muted)}
.bprev{position:absolute;left:48px;top:556px;width:1084px;height:150px;display:flex;align-items:center;gap:24px;padding:0 24px;font-size:15.5px;line-height:1.55;color:var(--body)}
.bprev b{font-weight:500;color:var(--ink)}

/* tray / box top view (product rendering) */
.bxw{position:relative;flex:none}
.bx{position:absolute;left:0;top:0;transform-origin:0 0}
.bx-tray{border-radius:50%;background:radial-gradient(circle closest-side at 50% 50%,#e8c873 0%,#c79b45 55%,#9c7428 74%,#f4f1ea 75.5%,#fff 82%,#e3ddd2 92%,#b78f3f 93%,#d7b766 97%,#9c7428 100%);box-shadow:0 12px 24px rgba(70,50,20,.18)}
.bx-classic{border-radius:6px;background:linear-gradient(#f6eddc,#eadcc2);box-shadow:0 10px 22px rgba(80,60,30,.16),inset 0 0 0 3px #c9a55a,inset 0 0 0 9px #f3e8d4,inset 0 6px 16px 9px rgba(120,90,40,.2)}
.bx-celebration{border-radius:6px;background:radial-gradient(circle at 40% 30%,#56623b,#38411f 70%);box-shadow:0 12px 24px rgba(50,40,20,.2),inset 0 0 0 4px #c9a55a,inset 0 0 0 12px #f3ead8,inset 0 0 0 14px #c9a55a,inset 0 8px 20px 14px rgba(0,0,0,.25)}
.cup{position:absolute;width:60px;height:60px;border-radius:12px;background:radial-gradient(circle,#4c2f1d 0 48%,transparent 49%),repeating-conic-gradient(#3b2416 0 7deg,#57371f 7deg 14deg);box-shadow:inset 0 2px 6px rgba(0,0,0,.45),0 1px 0 rgba(255,255,255,.35);transition:box-shadow .2s,transform .2s}
.bx-tray .cup{width:56px;height:56px;border-radius:50%}
.cup img{position:absolute;left:50%;top:50%;width:96%;transform:translate(-50%,-54%);filter:drop-shadow(0 4px 3px rgba(0,0,0,.4));pointer-events:auto;touch-action:none}
.cup.sel{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--forest),inset 0 2px 6px rgba(0,0,0,.45);z-index:2}
.cup.hot{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--sage2);transform:scale(1.08);z-index:3}
.cup.pop img{animation:drop .38s cubic-bezier(.2,1.4,.4,1)}
@keyframes drop{from{transform:translate(-50%,-110%) scale(1.35);opacity:0}}

/* create */
.tools{position:absolute;right:48px;top:110px;display:flex;gap:8px}
.tl{height:42px;padding:0 18px;border:1px solid var(--line2);background:var(--paper);font-size:14.5px;display:inline-flex;align-items:center;gap:8px}
.cl-left{position:absolute;left:48px;top:196px;width:620px;height:432px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.hint{margin-top:12px;font-size:14px;color:var(--muted);text-align:center;min-height:46px;display:flex;align-items:center}
.selbar{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--forest);padding:5px 6px 5px 8px;font-size:14px;color:var(--body);animation:pop .2s}
.selbar img{width:34px;height:34px;object-fit:contain;background:var(--tile)}
.selbar b{font-weight:500;color:var(--ink)}
.sb{height:34px;padding:0 14px;border:1px solid var(--line2);font-size:13.5px;font-weight:500}
.sb.dk{background:var(--forest);color:var(--ivory);border-color:var(--forest)}
.panel{position:absolute;right:48px;top:196px;width:448px;max-height:432px;overflow-y:auto;scrollbar-width:none;padding:6px 16px 10px}
.panel::-webkit-scrollbar{display:none}
.panel h3{margin:8px 0 6px;font-weight:400;font-size:20px}
.sec{font-size:12.5px;color:var(--muted);margin:12px 0 4px}
.prow{display:flex;align-items:center;gap:14px;padding:5px 0;border-top:1px solid var(--line);touch-action:pan-y;transition:background .2s}
.prow.rep{background:var(--mint)}
.prow img{width:46px;height:42px;object-fit:contain;background:var(--tile);pointer-events:none}
.prow span{flex:1;font-size:16px;line-height:1.2}
.stp{display:flex;align-items:center;border:1px solid var(--line2);background:var(--paper)}
.stp button{width:42px;height:38px;font-size:20px;line-height:1;color:var(--ink)}
.stp b{width:30px;text-align:center;font-weight:500;font-size:16px;font-variant-numeric:tabular-nums}
.stp .off{opacity:.25}
.stats{position:absolute;left:48px;top:642px;height:74px;max-width:470px;display:flex;align-items:center;gap:20px;padding:0 22px}
.st{display:flex;align-items:center;gap:12px}
.st svg{width:28px;height:28px;color:var(--sage)}
.st small{display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--muted)}
.st b{display:block;font-weight:400;font-size:24px;line-height:1.15;white-space:nowrap;font-variant-numeric:tabular-nums}
.eye{font-size:12px;padding:1px 8px;border:1px solid var(--line2);color:var(--body)}
.vr{width:1px;height:42px;background:var(--line2)}
.bud{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;white-space:nowrap}
.bud button{text-decoration:underline;font-size:12px;color:var(--body)}
.bud .ok{color:#3f6b33}.bud .ov{color:var(--warn)}
.fill{position:absolute;left:560px;top:656px;width:300px;display:flex;align-items:center;gap:12px;font-size:14px;white-space:nowrap;color:var(--body)}
.bar{flex:1;height:6px;background:rgba(30,59,44,.1);overflow:hidden}
.bar i{display:block;height:100%;background:var(--forest);transition:width .35s cubic-bezier(.3,1.3,.5,1)}
.bar.full i{background:var(--sage)}
.fillsub{position:absolute;left:560px;top:684px;font-size:13px;color:var(--muted)}

/* personalize */
.pv{position:absolute;left:48px;top:196px;width:520px;height:384px;background:var(--tile)}
.pv svg{width:100%;height:100%}
.pv .cap{position:absolute;left:14px;top:12px;font-size:12.5px;color:var(--body)}
.acc{position:absolute;right:48px;top:196px;width:548px;display:flex;flex-direction:column;gap:10px}
.acc .card.on{box-shadow:none;border-color:var(--line2);background:#fff}
.ah{display:flex;align-items:center;gap:16px;width:100%;height:66px;padding:0 18px 0 9px;text-align:left}
.ah img{width:76px;height:48px;object-fit:contain;background:var(--tile)}
.ah b{font-weight:400;font-size:19px;flex:1}
.ah small{font-size:14px;color:var(--muted)}
.ah::after{content:"";width:8px;height:8px;border-right:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);transform:rotate(45deg);margin:-4px 2px 0 6px;transition:transform .2s}
.on>.ah::after{transform:rotate(-135deg);margin-top:4px}
.ab{padding:2px 18px 16px}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.swb{display:flex;flex-direction:column;align-items:center;gap:6px;width:92px;font-size:13px;text-align:center;line-height:1.2;color:var(--body)}
.swb i{width:48px;height:48px;border:1px solid var(--line2);transition:box-shadow .2s}
.swb.on{color:var(--ink);font-weight:500}
.swb.on i{box-shadow:0 0 0 2px var(--paper),0 0 0 3px var(--forest)}
.cdc{display:flex;gap:8px;margin-bottom:10px}
.cdc button{flex:1;height:40px;border:1px solid var(--line2);font-size:14px}
.cdc button.on{background:var(--forest);color:var(--ivory);border-color:var(--forest)}
.msg{width:100%;height:68px;resize:none;border:1px solid var(--line2);border-radius:0;background:#fff;padding:9px 12px;font-size:19px;line-height:1.35;color:var(--ink)}
.mrow{display:flex;gap:8px;margin-top:8px}
.mrow input{flex:1;height:44px;border:1px solid var(--line2);border-radius:0;background:#fff;padding:0 12px;font-size:19px;color:var(--ink)}
.mrow button{padding:0 14px;border:1px solid var(--line2);font-size:13.5px;white-space:nowrap}
.msg:focus,.mrow input:focus{outline:none;border-color:var(--forest)}
.ctr{font-size:12px;color:var(--muted);text-align:right;margin-top:4px}
.fbar{position:absolute;left:48px;top:596px;width:520px;height:66px;display:flex;align-items:center;gap:16px;padding:0 20px;font-size:15px;color:var(--body);white-space:nowrap}
.fbar b{font-weight:400;font-size:24px;color:var(--ink);font-variant-numeric:tabular-nums}
.fbar .pc{margin-left:auto}

/* review */
.rvl{position:absolute;left:48px;top:196px;width:450px;height:514px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;background:var(--tile);border:0}
.cnts{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:18px}
.cnts span{display:flex;align-items:center;gap:6px;font-size:13.5px;background:var(--paper);padding:3px 10px 3px 4px}
.cnts img{width:26px}
.rvr{position:absolute;left:518px;top:196px;width:614px;height:514px;padding:4px 24px;overflow:hidden}
.rr{display:flex;align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
.rr:last-child{border:0}
.rr .k{width:116px;font-size:13.5px;color:var(--muted);flex:none}
.rr .v{flex:1;font-size:16.5px;line-height:1.4}
.rr .v i{font-style:italic;color:var(--body)}
.rr small{font-size:12px;color:var(--muted)}
.ed{height:34px;padding:0 14px;border:1px solid var(--line2);font-size:13.5px}
.sws{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-right:6px;border:1px solid var(--line2)}
.warn{font-size:13.5px;color:#9c4b1f;margin-top:4px}


/* vector artwork */
.lg{display:block;width:30px;height:30px;color:var(--forest)}.lg svg{width:100%;height:100%}
.tile.ic{color:var(--forest)}.fcard .tile.ic svg{width:62px;height:62px}
.ah .tile.ic{width:64px;height:48px}.ah .tile.ic svg{width:40px;height:40px}
.bcard .tile.bxart svg{width:100%;height:100%;padding:10px 8px 0}
.tile img{filter:none}
.cup img{width:104%;transform:translate(-50%,-50%);filter:none}
.hero-i{flex:1;position:relative;overflow:hidden;background:#e9e2d6}
.hero-tray{position:absolute;left:96px;top:96px}
.hero-loose{position:absolute;left:34px;bottom:36px;display:flex;gap:6px}
.hero-loose img{width:120px}
.hero-rb{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
/* host console */
.host{position:absolute;inset:0;background:var(--ivory)}
.hh{position:absolute;left:0;right:0;top:0;height:72px;border-bottom:1px solid var(--forest);display:flex;align-items:center;gap:14px;padding:0 20px 0 32px;color:var(--ink)}
.hh img{width:28px}
.hh .t{font-weight:500;font-size:18px;line-height:1.15}
.hh .t small{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.hh .sp2{flex:1}
.sync{font-size:13px;padding:6px 12px;border:1px solid var(--line2);display:flex;align-items:center;gap:8px;color:var(--body)}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:#b9b29b}
.sync.live::before{background:#4f9a3c}
.hb{height:40px;padding:0 16px;border:1px solid var(--forest);color:var(--forest);font-weight:500;font-size:14px;background:transparent}
.hb.dk{background:var(--forest);color:var(--ivory)}
.hb.gold{background:var(--sage);border-color:var(--sage);color:#fff}
.hm{width:40px;height:40px;display:grid;place-items:center;opacity:.7}
.hm svg{width:20px}
.hcols{position:absolute;left:24px;right:24px;top:88px;bottom:16px;display:grid;grid-template-columns:292px minmax(0,1fr) minmax(0,1fr);gap:14px}
.hcol{display:flex;flex-direction:column;gap:14px;overflow-y:auto;scrollbar-width:none;padding-bottom:4px}
.hcol::-webkit-scrollbar{display:none}
.hc{background:var(--paper);border:1px solid var(--line);padding:14px 16px}
.hc h4{margin:0 0 10px;font-weight:500;font-size:16px;display:flex;align-items:center;gap:8px}
.hc h4 span{flex:1}
.hc h4 small{font-size:12.5px;color:var(--muted);font-weight:400}
.hc h4 .hb{height:30px;padding:0 10px;font-size:12.5px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:3px 0}

.hchips{display:flex;flex-wrap:wrap;gap:6px}
.hchip{font-size:13px;padding:3px 10px;background:var(--mint);color:var(--forest)}
.hchip.al{background:#f6e3d6;color:#9c4b1f}
.none{font-size:13.5px;color:#9a9f98;font-style:italic}
.req{background:var(--mint);border-left:3px solid var(--forest);padding:9px 12px;margin-bottom:8px;font-size:14px;display:flex;align-items:center;gap:10px}
.req b{flex:1;font-weight:500}

.lock{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);background:var(--ivory);padding:8px 10px;margin-top:4px}
.lock svg{width:16px;flex:none}
.ticket{border:1px dashed var(--line2);padding:10px 12px;margin-top:10px;font-size:14px}
.ticket li{margin:3px 0}
.bigp{font-weight:300;font-size:34px;font-variant-numeric:tabular-nums}
.hact{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}

/* overlays */
#ghost{position:fixed;left:0;top:0;width:78px;pointer-events:none;z-index:50;display:none;filter:drop-shadow(0 12px 10px rgba(0,0,0,.3))}
#toast{position:fixed;left:50%;top:9%;transform:translate(-50%,-30px);background:var(--forest);color:var(--ivory);padding:12px 22px;font-size:15px;opacity:0;transition:all .3s;z-index:60;display:flex;gap:16px;align-items:center;max-width:90vw;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{color:var(--sage2);font-weight:500;text-decoration:underline}
#modal{position:fixed;inset:0;z-index:70;display:none;place-items:center;background:rgba(30,40,32,.4)}
#modal.show{display:grid}
.mbox{background:var(--paper);padding:28px 30px;width:min(520px,92vw);max-height:90vh;overflow:auto;border-top:3px solid var(--forest)}
.mbox h3{margin:0 0 6px;font-weight:300;font-size:28px}
.mbox p{margin:0 0 16px;color:var(--body);font-size:15px}
.ml{display:flex;flex-direction:column;gap:8px}
.mi{display:flex;align-items:center;text-align:left;padding:12px 16px;border:1px solid var(--line2);font-size:16px}
.mi.on{background:var(--forest);color:var(--ivory);border-color:var(--forest)}
.mi small{display:block;font-size:13px;opacity:.72}

.mbtn{height:46px;padding:0 22px;border:1px solid var(--forest);font-weight:500}
.mbtn.dk{background:var(--forest);color:var(--ivory)}
.mchips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 16px}
.mchips button{height:40px;padding:0 16px;border:1px solid var(--line2);font-size:14.5px}
.mchips button.on{background:var(--forest);color:var(--ivory);border-color:var(--forest)}
.mbox label{font-size:13px;color:var(--muted)}
.mbox input{width:100%;height:46px;border:1px solid var(--line2);background:#fff;padding:0 12px;font-size:17px;margin:6px 0 4px}
.mbox textarea{width:100%;height:220px;font:13px/1.4 ui-monospace,monospace;border:1px solid var(--line2);padding:10px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<script>
{
// ---------- data (sample values for testing — simulated, not official Patchi prices) ----------
const FL=[{id:'soft',n:'Soft & Nostalgic'},{id:'rich',n:'Rich & Classic'},{id:'nutty',n:'Nutty & Crunchy'},{id:'fruity',n:'Bright & Fruity'},{id:'floral',n:'Floral & Delicate'},{id:'bold',n:'Bold & Adventurous'}];
const FLM=Object.fromEntries(FL.map(f=>[f.id,f.n]));
const AV=[{id:'nuts',n:'Nuts'},{id:'dairy',n:'Dairy- free'},{id:'sugar',n:'Sugar conscious'}];
const CH=[
 {id:'pistachio',n:'Pistachio Praline',d:'A smooth chocolate with roasted pistachio and a velvety finish.',fl:['nutty','soft'],nuts:1,dairy:1,sugar:'med',g:13,p:7.5},
 {id:'raspberry',n:'Raspberry Honey',d:'White chocolate ganache with raspberry and a drizzle of wildflower honey.',fl:['fruity','floral'],dairy:1,sugar:'high',g:12,p:7},
 {id:'caramel',n:'Salted Caramel',d:'A milk chocolate shell around a soft caramel heart, finished with sea-salt flakes.',fl:['rich','soft'],dairy:1,sugar:'high',g:12,p:7},
 {id:'dark',n:'Dark Cacao',d:'A deep 64% dark ganache — round, gently bitter, and dairy-free.',fl:['rich','bold'],sugar:'low',g:11,p:7.5},
 {id:'hazelnut',n:'Hazelnut Crunch',d:'Milk gianduja rolled in caramelised hazelnut pieces for a satisfying crunch.',fl:['nutty','rich'],nuts:1,dairy:1,sugar:'med',g:14,p:7.5},
 {id:'orange',n:'Orange Zest',d:'Dark chocolate with candied orange peel and a bright citrus ganache.',fl:['fruity','bold'],sugar:'med',g:12,p:7},
 {id:'date',n:'Date & Cardamom',d:'Milk chocolate filled with Khalas date paste and a warm hint of cardamom.',fl:['soft','rich'],dairy:1,sugar:'med',g:14,p:7.5},
 {id:'rose',n:'Rose Ganache',d:'A delicate rose-water ganache made with coconut cream — light and floral.',fl:['floral','soft'],sugar:'med',g:11,p:8},
 {id:'saffron',n:'Saffron Caramel',d:'Caramel infused with saffron threads beneath a milk chocolate shell.',fl:['bold','floral'],dairy:1,sugar:'high',g:12,p:8.5},
 {id:'sfdark',n:'70% Sugar-Free Dark',d:'Intense 70% dark chocolate with no added sugar and a clean cacao finish.',fl:['bold','rich'],sugar:'low',g:10,p:8}
];
const CHM=Object.fromEntries(CH.map(c=>[c.id,c]));
const BX={classic:{n:'Classic Box',cap:16,base:40,W:600,H:190,desc:'two neat rows of eight'},tray:{n:'Signature Tray',cap:24,base:60,W:460,H:460,desc:'three concentric rings'},celebration:{n:'Celebration Box',cap:36,base:85,W:460,H:460,desc:'a six-by-six grid on olive velvet'}};
const BXO=['classic','tray','celebration'];
const WR=[{id:'cream',n:'Atelier Cream',c:'#efe3cb'},{id:'olive',n:'Olive Velvet',c:'#4d5a33'},{id:'gold',n:'Gold Foil',c:'#c9a55a'},{id:'blush',n:'Blush Linen',c:'#e8c6bd'}];
const RB=[{id:'olive',n:'Olive Satin',c:'#6f7d3c'},{id:'gold',n:'Gold',c:'#c49a45'},{id:'ivory',n:'Ivory',c:'#f6eedf'},{id:'burgundy',n:'Burgundy',c:'#7a2632'},{id:'blush',n:'Blush',c:'#d9a3a0'}];
const CD=[{id:'ivory',n:'Ivory Classic'},{id:'gold',n:'Gold-Edged'},{id:'floral',n:'Pressed Flower'}];
const REC={Mother:{s:'Mom',pp:'her'},Father:{s:'Dad',pp:'his'},Wife:{s:'your wife',pp:'her'},Husband:{s:'your husband',pp:'his'},Sister:{s:'your sister',pp:'her'},Brother:{s:'your brother',pp:'his'},Friend:{s:'your friend',pp:'their'},Colleague:{s:'your colleague',pp:'their'}};
const OCC=['Birthday',"Mother's Day",'Eid','Anniversary','Graduation','Thank You','Just Because'];
const ST=['attract','welcome','flavor','pick','tasting','favorites','box','create','personalize','review','done'];
const STN={attract:'Welcome screen',welcome:'Introduction',flavor:'Flavor profile',pick:'Tasting selection',tasting:'Guided tasting',favorites:'Favorites',box:'Arrangement',create:'Create the gift',personalize:'Personalize',review:'Review',done:'Confirmed'};
const DOTS=['flavor','pick','tasting','favorites','box','create','personalize'];
const MSGS=n=>[`Happy Birthday, ${n==='Mom'?'Mama':n} — every sweet moment started with you.`,'To the heart of our home. With all my love, today and always.','Thank you for everything you are. Enjoy every piece!'];

// ---------- icons ----------
const I={
 check:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
 heart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 20s-7.5-4.6-9-9.3C2 7.4 4.2 4.5 7.3 4.5c2 0 3.6 1.1 4.7 2.8 1.1-1.7 2.7-2.8 4.7-2.8 3.1 0 5.3 2.9 4.3 6.2C19.5 15.4 12 20 12 20z"/></svg>',
 heartf:'<svg viewBox="0 0 24 24" fill="#5c7a35"><path d="M12 20s-7.5-4.6-9-9.3C2 7.4 4.2 4.5 7.3 4.5c2 0 3.6 1.1 4.7 2.8 1.1-1.7 2.7-2.8 4.7-2.8 3.1 0 5.3 2.9 4.3 6.2C19.5 15.4 12 20 12 20z"/></svg>',
 thumb:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M7 10.5V20H4v-9.5h3zm0 0l4-7c1.6 0 2.6 1.2 2.2 2.8L12.6 9H19c1.2 0 2 1.1 1.7 2.2l-1.9 7C18.6 19.3 17.7 20 16.6 20H7"/></svg>',
 thumbs:'<svg viewBox="0 0 24 24" fill="#a17b22"><path d="M7 10.5V20H4v-9.5h3zm1 0l4-7c1.6 0 2.6 1.2 2.2 2.8L13.6 9H19c1.2 0 2 1.1 1.7 2.2l-1.9 7c-.2 1.1-1.1 1.8-2.2 1.8H8z"/></svg>',
 x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>',
 xs:'<svg viewBox="0 0 24 24" fill="none" stroke="#a2412a" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
 arrow:'<svg viewBox="0 0 30 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h23M18 4l8 8-8 8"/></svg>',
 back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H5M11 5l-7 7 7 7"/></svg>',
 restart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5"/></svg>',
 menu:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>',
 bag:'<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 10a4 4 0 0 1 8 0M7 10h18l2 17H5z"/></svg>',
 coins:'<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5"><ellipse cx="13" cy="9" rx="8" ry="3"/><path d="M5 9v4c0 1.7 3.6 3 8 3s8-1.3 8-3V9M5 13v4c0 1.7 3.6 3 8 3M5 17v4c0 1.7 3.6 3 8 3"/><ellipse cx="21" cy="19" rx="7" ry="2.6"/><path d="M14 19v4c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6v-4"/></svg>',
 lock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>',
 dot:'<svg viewBox="0 0 24 24" fill="#9a927c"><circle cx="12" cy="12" r="3"/></svg>'
};

// ---------- state ----------
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const rid=()=>Math.random().toString(36).slice(2,7).toUpperCase();
function fresh(k){const now=Date.now();return{v:1,rev:0,ts:now,sid:rid(),recipient:(k&&k.recipient)||'Mother',occasion:(k&&k.occasion)||'Birthday',guest:(k&&k.guest)||'',stage:'attract',maxIdx:0,startedAt:now,times:{attract:now},flavors:[],avoid:[],tastePick:[],tasteIdx:0,reactions:{},favorites:[],box:null,slots:[],wrap:'cream',ribbon:'olive',card:'ivory',message:'',from:'',status:'active',order:'',confirmedAt:0,tastingReq:false,tastingServed:false,sentAt:0,readyAt:0}}
function sanitize(d){
  const f=fresh();
  for(const k in f){const v=d[k];if(v===undefined)continue;
    if(k==='box'){f.box=(v===null||BX[v])?v:null;continue}
    if(Array.isArray(f[k])){if(Array.isArray(v))f[k]=v.slice(0,60);continue}
    if(typeof v===typeof f[k]&&v!==null)f[k]=v}
  const okId=x=>typeof x==='string'&&CHM[x];
  f.flavors=f.flavors.filter(x=>FLM[x]).slice(0,3);f.avoid=f.avoid.filter(x=>AV.some(a=>a.id===x));
  f.tastePick=f.tastePick.filter(okId);f.favorites=f.favorites.filter(okId);
  f.slots=f.slots.map(x=>okId(x)?x:null);
  if(!ST.includes(f.stage))f.stage='attract';
  if(!REC[f.recipient])f.recipient='Mother';
  const rx={};for(const k in f.reactions)if(CHM[k]&&['love','maybe','no'].includes(f.reactions[k]))rx[k]=f.reactions[k];f.reactions=rx;
  const tm={};for(const k in f.times)if(ST.includes(k)&&typeof f.times[k]==='number')tm[k]=f.times[k];f.times=tm;
  if(!WR.some(x=>x.id===f.wrap))f.wrap='cream';if(!RB.some(x=>x.id===f.ribbon))f.ribbon='olive';if(!CD.some(x=>x.id===f.card))f.card='ivory';
  if(!['active','confirmed','backstage','ready'].includes(f.status))f.status='active';f.tasteIdx=Math.max(0,Math.floor(f.tasteIdx)||0);f.maxIdx=Math.max(0,Math.min(ST.length-1,Math.floor(f.maxIdx)||0));
  f.message=String(f.message).slice(0,140);f.from=String(f.from).slice(0,40);f.guest=String(f.guest).slice(0,40);
  return f}
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let S=store.get('hm-state');S=S?sanitize(S):fresh();
const L=Object.assign({hide:false,budget:0},store.get('hm-local')||{},{sel:null,last:null,modal:null,undo:null,acc:'wrap',mode:'customer',dragging:false});
const R=()=>REC[S.recipient]||REC.Mother, who=()=>R().s, Who=()=>cap(who()), poss=()=>who()+"'s", pp=()=>R().pp;
const persist=()=>{store.set('hm-state',S);store.set('hm-local',{hide:L.hide,budget:L.budget})};

// ---------- sync: same device (tabs) + across devices (artifact room) ----------
let room=null,peers=1,bc=null,sendT=null;
try{bc=new BroadcastChannel('heartmade-atelier');bc.onmessage=e=>recv(e.data)}catch(e){}
function send(){clearTimeout(sendT);sendT=setTimeout(()=>{const d=JSON.parse(JSON.stringify(S));try{bc&&bc.postMessage(d)}catch(e){}try{room&&room.emit('state',d)}catch(e){}},60)}
function recv(d){if(!d||typeof d!=='object'||typeof d.rev!=='number')return;
  if(d.rev>S.rev||(d.rev===S.rev&&d.ts>S.ts)){const prevSid=S.sid;S=sanitize(d);if(S.sid!==prevSid){L.sel=null;L.budget=0;L.hide=false}persist();render()}}
(async()=>{try{if(!window.claude||!window.claude.use)return;const r=await window.claude.use('room');if(!r)return;room=r;
  r.on('state',d=>recv(d));r.on('hello',()=>send());
  r.onPeers(p=>{peers=Math.max(1,Array.isArray(p)?p.length:(p&&typeof p==='object'?Object.keys(p).length:1));renderSync()});
  try{r.presence({role:L.mode})}catch(e){}try{r.emit('hello',{})}catch(e){}send();renderSync()}catch(e){}})();
function syncLabel(){return room?(peers>1?`Live sync · ${peers} devices`:'Live sync · waiting for 2nd device'):'This device only'}
function renderSync(){document.querySelectorAll('.sync').forEach(el=>{el.textContent=syncLabel();el.classList.toggle('live',!!room&&peers>1)})}

// ---------- helpers ----------
function commit(fn,quiet){fn(S);S.rev++;S.ts=Date.now();persist();send();if(!quiet)render()}
function go(st){L.sel=null;commit(s=>{s.stage=st;const i=ST.indexOf(st);s.maxIdx=Math.max(s.maxIdx,i);s.times[st]=s.times[st]||Date.now()})}

 if(m.t==='session'){const d=m.d;return `<div class="mbox"><h3>${m.edit?'Edit session':'Start a new gifting session'}</h3><p>${m.edit?'Updates the guest’s screens right away.':'The guest’s tablet returns to the welcome screen.'}</p><label>Recipient</label><div class="mchips">${Object.keys(REC).map(k=>`<button class="${d.recipient===k?'on':''}" data-act="sd" data-k="recipient" data-v="${k}">${k}</button>`).join('')}</div><label>Occasion</label><div class="mchips">${OCC.map(k=>`<button class="${d.occasion===k?'on':''}" data-act="sd" data-k="occasion" data-v="${esc(k)}">${esc(k)}</button>`).join('')}</div><label for="gname">Guest first name (optional)</label><input id="gname" maxlength="40" value="${esc(d.guest)}"><div class="mact"><button class="mbtn" data-act="close">Cancel</button><button class="mbtn dk" data-act="startsess">${m.edit?'Save':'Start Session'}</button></div></div>`}
 if(m.t==='log')return `<div class="mbox"><h3>Session log</h3><p>Copied to your clipboard if allowed — otherwise select and copy below.</p><textarea readonly>${esc(logText())}</textarea><div class="mact"><button class="mbtn dk" data-act="close">Close</button></div></div>`;

function logText(){const t=tot(),o=[`HeartMade Gifting Atelier — session ${S.sid}`,`Recipient: ${S.recipient} · Occasion: ${S.occasion}${S.guest?' · Guest: '+S.guest:''}`,`Started: ${new Date(S.startedAt).toLocaleString()}`,'','Time per step:'];
 ST.forEach((st,i)=>{const a=S.times[st];if(!a)return;const nx=ST.slice(i+1).map(x=>S.times[x]).filter(Boolean)[0]||(S.status!=='active'?S.confirmedAt:Date.now());o.push(`  ${STN[st]}: ${fmt(nx-a)}`)});
 o.push('',`Flavors: ${S.flavors.map(f=>FLM[f]).join(', ')||'—'}`,`Avoid: ${S.avoid.join(', ')||'—'}`,'Tasting reactions:');S.tastePick.forEach(id=>o.push(`  ${CHM[id].n}: ${S.reactions[id]||'—'}`));
 o.push(`Favorites: ${S.favorites.map(id=>CHM[id].n).join(', ')||'—'}`,`Box: ${S.box?BX[S.box].n:'—'} · ${t.n}/${t.cap} pieces · ≈${t.g} g · ${t.p} SAR (simulated)`);
 [...new Set(S.slots.filter(Boolean))].forEach(id=>o.push(`  ${count(id)}× ${CHM[id].n}`));
 o.push(`Wrapping: ${S.wrap} · Ribbon: ${S.ribbon} · Card: ${S.card}`,`Message: ${S.message||'—'}${S.from?' — '+S.from:''}`,`Status: ${S.status}${S.order?' · '+S.order:''}`);return o.join('\n')}

// ---------- drag & drop (touch + mouse) ----------
const ghost=document.getElementById('ghost');let drag=null;
document.addEventListener('dragstart',e=>e.preventDefault());
document.addEventListener('pointerdown',e=>{const el=e.target.closest('[data-drag]');if(!el||e.target.closest('.stp')||S.stage!=='create')return;
 const src=el.dataset.drag==='slot'?{kind:'slot',i:+el.dataset.i,id:S.slots[+el.dataset.i]}:{kind:'pal',id:el.dataset.id};if(!src.id)return;
 drag={src,x:e.clientX,y:e.clientY,on:false,hot:null}});
addEventListener('pointermove',e=>{if(!drag)return;
 if(!drag.on){if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<9)return;drag.on=true;ghost.src=img(drag.src.id);ghost.style.display='block';
  const k=cust.getBoundingClientRect().width/1180||1;ghost.style.width=Math.max(56,78*k)+'px';if(drag.src.kind==='slot'){const c=cust.querySelector(`[data-slot="${drag.src.i}"] img`);if(c)c.style.opacity='.25'}}
 e.preventDefault();ghost.style.transform=`translate(${e.clientX-ghost.offsetWidth/2}px,${e.clientY-ghost.offsetHeight*.6}px) rotate(-6deg) scale(1.1)`;
 const under=document.elementFromPoint(e.clientX,e.clientY),slot=under&&under.closest('[data-slot]');
 if(drag.hot&&drag.hot!==slot)drag.hot.classList.remove('hot');if(slot){slot.classList.add('hot');drag.hot=slot}else drag.hot=null},{passive:false});
function endDrag(e){if(!drag)return;const d=drag;drag=null;if(!d.on)return;suppress=true;setTimeout(()=>{suppress=false},60);ghost.style.display='none';
 const under=document.elementFromPoint(e.clientX,e.clientY),slot=under&&under.closest('[data-slot]'),inBox=under&&under.closest('.bx');
 if(slot){const j=+slot.dataset.slot;
  if(d.src.kind==='pal'){L.sel=null;place(d.src.id,j)}
  else if(j!==d.src.i){L.last=j;commit(s=>{const a=s.slots[d.src.i];s.slots[d.src.i]=s.slots[j]||null;s.slots[j]=a});setTimeout(()=>{L.last=null},450)} else render()}
 else if(d.src.kind==='slot'&&!inBox){L.undo=S.slots.slice();L.sel=null;commit(s=>{s.slots[d.src.i]=null});toast(`${CHM[d.src.id].n} removed.`,true)}
 else render()}
addEventListener('pointerup',endDrag);addEventListener('pointercancel',e=>{if(drag&&drag.on){drag=null;ghost.style.display='none';render()}else drag=null});

readHash();render();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
}
</script>
